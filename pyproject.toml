[project]
name = "flybrain"
version = "0.1.0"
description = "Explore the FlyWire fruit-fly brain in 3D and through an LLM agent with tools"
readme = "README.md"
authors = [
    { name = "eJosR-Coding", email = "72283818+eJosR-Coding@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.7.7",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.20",
    "mcp<2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
]

[project.scripts]
flybrain-mcp = "flybrain.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
