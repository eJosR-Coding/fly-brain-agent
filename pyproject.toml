[project]
name = "flybrain"
version = "0.1.0"
description = "Explore the FlyWire fruit-fly brain in 3D and through an LLM agent with tools"
readme = "README.md"
license = "MIT"
authors = [
    { name = "eJosR-Coding", email = "72283818+eJosR-Coding@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.3",
    "langchain>=1.4.9",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.7.7",
    "langchain-deepseek>=1.1.1",
    "langchain-google-genai>=4.4.3",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.20",
    "mcp<2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
flybrain-mcp = "flybrain.mcp_server:main"
flybrain-chat = "flybrain.cli:entrypoint"
flybrain-web = "flybrain.web:entrypoint"
flybrain-build-connectome = "flybrain.connectome_build:main"
flybrain-build-sim-weights = "flybrain.sim_service:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
